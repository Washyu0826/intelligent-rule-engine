# ============================================================
# Rules MCP Server — Docker Compose
# ============================================================
# Usage:
#   dev:  docker compose up
#   prod: docker compose --profile prod up
# ============================================================

services:
  # ── PostgreSQL（P1-S2：規則庫 / 稽核落地）──
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rules
      POSTGRES_USER: rules
      # 僅本地開發用；雲上由 secret 注入，見 k8s/02-external-secret.yaml
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rules-local-dev}
    ports:
      # 對外 5433：本機已有一個 PostgreSQL 服務占著 5432，避開它；
      # 容器之間（rules-mcp-server → postgres）走內部網路，不受此映射影響
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready 回 0 才算 healthy —— app 服務靠 depends_on.condition 等它
      test: ["CMD-SHELL", "pg_isready -U rules -d rules"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── Rules MCP Server ──
  rules-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-default}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
      - JAVA_OPTS=-Xmx512m -Xms256m
      # LLM provider config (override via .env)
      - RULES_LLM_PROVIDER=${RULES_LLM_PROVIDER:-gemini}
      - RULES_LLM_MODEL=${RULES_LLM_MODEL:-gemini-2.0-flash}
      - RULES_LLM_TIMEOUT_SECONDS=${RULES_LLM_TIMEOUT_SECONDS:-30}
      # Ollama (if using local)
      - RULES_LLM_OLLAMA_BASE_URL=${RULES_LLM_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Database（容器內用服務名 postgres 連線）
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/rules
      - SPRING_DATASOURCE_USERNAME=rules
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-rules-local-dev}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ── Frontend Dev Server (dev only) ──
  frontend-dev:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend-src/frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    profiles:
      - dev

volumes:
  pgdata:
