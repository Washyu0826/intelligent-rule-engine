apiVersion: apps/v1
kind: Deployment
metadata:
  name: rules-mcp-backend
  namespace: rules-mcp
  labels:
    app: rules-mcp
    component: backend
    version: "3.13.0"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0          # 金融業嚴格要求 — 不允許滾動升級期間降容
  selector:
    matchLabels:
      app: rules-mcp
      component: backend
  template:
    metadata:
      labels:
        app: rules-mcp
        component: backend
        version: "3.13.0"
      annotations:
        # 由 Prometheus Operator 自動發現（若用 ServiceMonitor 可移除這些）
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: rules-mcp-sa
      automountServiceAccountToken: false   # 此 Pod 無需呼叫 K8s API
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # 跨 AZ 反親和性（不要全擠在同一 AZ）
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: topology.kubernetes.io/zone
                labelSelector:
                  matchLabels:
                    app: rules-mcp
                    component: backend
            - weight: 50
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: rules-mcp
                    component: backend
      containers:
        - name: backend
          # 將 IMAGE 替換為實際 registry 路徑；用 SHA digest 而非 tag 才不被 mutated
          image: ACCOUNT_ID.dkr.ecr.ap-east-2.amazonaws.com/rules-mcp-server@sha256:REPLACE_ME
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: rules-mcp-config
          env:
            - name: CLAUDE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-secrets
                  key: claude-api-key
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-secrets
                  key: gemini-api-key
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-secrets
                  key: openai-api-key
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: postgres-password
            - name: SPRING_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: redis-password
            # 將 Pod metadata 注入環境變數（log MDC 可帶 podName / nodeName）
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          # Spring Boot Actuator 健康檢查 — readiness 與 liveness 拆分
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30   # 給足 150s 啟動時間
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3    # 短暫不可用即移出 endpoints
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5    # 連續 5 次（75s）才殺
          lifecycle:
            preStop:
              exec:
                # 給予 15 秒讓 Service mesh 移除流量
                command: ["sleep", "15"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/cache
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
        - name: cache
          emptyDir:
            sizeLimit: 500Mi
