apiVersion: v1
kind: ConfigMap
metadata:
  name: rules-mcp-config
  namespace: rules-mcp
  labels:
    app: rules-mcp
data:
  # Spring profile
  # 注意：此處原本是 "cloud"，但 repo 內沒有 application-cloud.yml ——
  # Spring 會安靜地退回 application.yml，導致 prod 的所有加固（API key 認證、
  # WARN 級 log、CORS 白名單、LLM fail-fast）在叢集裡一條都不會生效。
  SPRING_PROFILES_ACTIVE: "prod"

  # LLM Provider 預設（可按 deployment 改）
  RULES_LLM_PROVIDER: "claude"
  RULES_LLM_TIMEOUT_SECONDS: "30"

  # Caching：目前應用只有 Caffeine 記憶體快取（pom.xml 沒有 spring-boot-starter-data-redis），
  # 此鍵未被任何 @Value 讀取 —— 保留為未來 Redis 化的設計佔位，非生效設定。
  CACHE_PROVIDER: "redis"

  # JVM 參數（容器化建議）
  JAVA_TOOL_OPTIONS: >-
    -XX:MaxRAMPercentage=75.0
    -XX:+UseG1GC
    -XX:+ExitOnOutOfMemoryError
    -Djava.security.egd=file:/dev/./urandom

  # Observability 相關
  MANAGEMENT_METRICS_TAGS_APPLICATION: "rules-mcp"
  MANAGEMENT_METRICS_TAGS_ENV: "prod"

  # OpenTelemetry（若有 collector）
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability:4317"
  OTEL_SERVICE_NAME: "rules-mcp-backend"
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=rules-mcp,deployment.environment=prod"

  # Audit log 落地策略（cloud profile 改寫至 S3 / Kafka）
  AUDIT_SINK: "kafka"
  AUDIT_KAFKA_BOOTSTRAP: "kafka.observability:9092"
  AUDIT_KAFKA_TOPIC: "rules-mcp.audit"

  # Rate limit
  RATE_LIMIT_REQUESTS_PER_MINUTE: "100"
  RATE_LIMIT_BURST: "20"
