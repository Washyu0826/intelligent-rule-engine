# Kustomize 入口 — base 配置
# 各環境（dev / staging / prod）建議在 k8s/overlays/<env>/ 下做 patch
# 使用：kubectl apply -k k8s/
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rules-mcp

commonLabels:
  app.kubernetes.io/name: rules-mcp
  app.kubernetes.io/managed-by: kustomize

resources:
  - 00-namespace.yaml
  - 01-configmap.yaml
  - 02-external-secret.yaml
  - 10-backend-deployment.yaml
  - 11-backend-service.yaml
  - 12-backend-hpa.yaml
  - 13-backend-pdb.yaml
  - 14-backend-networkpolicy.yaml
  - 20-frontend-deployment.yaml
  - 21-frontend-service.yaml
  - 30-ingress.yaml

# image tag 在各 overlay 覆寫；此處用 placeholder 讓 kustomize 偵測得到
images:
  - name: ACCOUNT_ID.dkr.ecr.ap-east-2.amazonaws.com/rules-mcp-server
    newTag: "3.13.0"
  - name: ACCOUNT_ID.dkr.ecr.ap-east-2.amazonaws.com/rules-mcp-frontend
    newTag: "3.13.0"
