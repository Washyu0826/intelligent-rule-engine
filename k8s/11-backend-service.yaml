apiVersion: v1
kind: Service
metadata:
  name: rules-mcp-backend
  namespace: rules-mcp
  labels:
    app: rules-mcp
    component: backend
spec:
  type: ClusterIP
  selector:
    app: rules-mcp
    component: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
# Prometheus Operator ServiceMonitor — 自動發現此 Service 的 /actuator/prometheus
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rules-mcp-backend
  namespace: rules-mcp
  labels:
    app: rules-mcp
    release: prometheus    # 視 Prometheus Operator 安裝時的 release name
spec:
  selector:
    matchLabels:
      app: rules-mcp
      component: backend
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: true
