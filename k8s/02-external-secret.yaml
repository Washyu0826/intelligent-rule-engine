# External Secrets Operator → AWS Secrets Manager 同步
# 文件：https://external-secrets.io/
# 1 小時自動 refresh，支援金鑰輪替（不重啟 Pod）。
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-east-2          # 台灣 region；視實際情況調整
      auth:
        # 用 IRSA (IAM Roles for Service Accounts)，避免硬編碼 AWS 憑證
        jwt:
          serviceAccountRef:
            name: rules-mcp-sa
            namespace: rules-mcp
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: llm-secrets
  namespace: rules-mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: llm-secrets
    creationPolicy: Owner
  data:
    - secretKey: claude-api-key
      remoteRef:
        key: rules-mcp/prod/claude-api-key
    - secretKey: gemini-api-key
      remoteRef:
        key: rules-mcp/prod/gemini-api-key
    - secretKey: openai-api-key
      remoteRef:
        key: rules-mcp/prod/openai-api-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-secrets
  namespace: rules-mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: db-secrets
    creationPolicy: Owner
  data:
    - secretKey: postgres-password
      remoteRef:
        key: rules-mcp/prod/postgres-password
    - secretKey: redis-password
      remoteRef:
        key: rules-mcp/prod/redis-password
---
# IRSA-bound ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rules-mcp-sa
  namespace: rules-mcp
  annotations:
    # 替換為實際 IAM Role ARN
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/rules-mcp-app
