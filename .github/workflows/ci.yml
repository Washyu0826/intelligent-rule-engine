name: CI — Build & Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  # ── Backend: Java Build & Test ──
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Test
        run: mvn clean verify -B

  # ── Frontend: TypeScript Check & Build ──
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-src/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ── Docker Build (on main only) ──
  docker:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t rules-mcp-server:latest .

      - name: Test Docker health
        run: |
          # 預設 profile 需要 PostgreSQL（Flyway migration + JPA validate），
          # 容器與 DB 同走 host 網路，連線字串用環境變數覆蓋（12-Factor）
          docker run -d --name test-db --network host \
            -e POSTGRES_DB=rules -e POSTGRES_USER=rules -e POSTGRES_PASSWORD=ci-only \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec test-db pg_isready -U rules -d rules && break
            sleep 2
          done
          docker run -d --name test-container --network host \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/rules \
            -e SPRING_DATASOURCE_USERNAME=rules \
            -e SPRING_DATASOURCE_PASSWORD=ci-only \
            rules-mcp-server:latest
          for i in $(seq 1 40); do
            curl -sf http://localhost:8080/actuator/health && exit 0
            sleep 3
          done
          docker logs test-container | tail -50
          exit 1
