<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rules MCP Server — Demo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root {
  --bg:#0a0d13; --s1:#111623; --s2:#171d2e; --s3:#1e2740;
  --bd:rgba(80,140,220,0.1); --bd2:rgba(80,140,220,0.2);
  --tx:#dce4f0; --tx2:#8494a7; --tx3:#556070;
  --ac:#508cdc; --ac2:#6e5ee0; --gn:#4cd97b; --rd:#e85d75; --og:#eda145; --cy:#45c8c2;
  --mono:'IBM Plex Mono',monospace; --sans:'Noto Sans TC',sans-serif;
  --rad:10px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(80,140,220,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(80,140,220,0.025) 1px,transparent 1px);
  background-size:48px 48px;}

/* HEADER */
.hdr{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;
  border-bottom:1px solid var(--bd);background:rgba(10,13,19,0.85);backdrop-filter:blur(12px);
  position:sticky;top:0;z-index:100;}
.hdr-logo{display:flex;align-items:center;gap:10px;}
.hdr-icon{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--ac),var(--ac2));
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;}
.hdr-title{font-size:15px;font-weight:600;letter-spacing:.3px;}
.hdr-title em{font-style:normal;color:var(--ac);}
.hdr-tag{font-family:var(--mono);font-size:9px;color:var(--tx3);letter-spacing:1.5px;
  border:1px solid var(--bd);padding:4px 10px;border-radius:3px;}
.hdr-dot{width:6px;height:6px;border-radius:50%;margin-right:4px;display:inline-block;animation:blink 2s infinite;}
.hdr-dot.on{background:var(--gn);}
.hdr-dot.off{background:var(--rd);}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.35;}}

/* PAGES */
.page{display:none;position:relative;z-index:1;}
.page.active{display:block;}

/* ===== INPUT PAGE ===== */
.inp-wrap{max-width:680px;margin:0 auto;padding:64px 24px 80px;}
.inp-hero{margin-bottom:48px;}
.inp-sub{font-size:12px;color:var(--ac);font-weight:500;display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.inp-sub::before{content:'';width:20px;height:1px;background:var(--ac);}
.inp-h1{font-size:40px;font-weight:900;line-height:1.25;margin-bottom:14px;}
.inp-h1 em{font-style:normal;color:var(--ac);}
.inp-desc{font-size:14px;color:var(--tx2);line-height:1.7;}
.inp-card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--rad);padding:28px;}
.inp-presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
.inp-pre{padding:5px 12px;border-radius:6px;font-size:10px;cursor:pointer;
  background:rgba(80,140,220,0.06);border:1px solid rgba(80,140,220,0.18);color:var(--ac);transition:.15s;}
.inp-pre:hover{background:rgba(80,140,220,0.12);}
.inp-label{display:block;font-size:12px;color:var(--tx2);margin-bottom:6px;}
.inp-field{width:100%;padding:12px 14px;background:var(--bg);color:var(--tx);
  border:1px solid var(--bd);border-radius:8px;font-family:var(--sans);font-size:14px;transition:.15s;}
.inp-field:focus{outline:none;border-color:var(--ac);}
textarea.inp-field{min-height:100px;resize:vertical;line-height:1.6;}
.inp-group{margin-bottom:18px;}
.inp-btn{width:100%;padding:14px;border:none;border-radius:8px;font-size:15px;font-weight:600;
  background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;cursor:pointer;
  letter-spacing:.5px;transition:.2s;margin-top:6px;}
.inp-btn:hover{filter:brightness(1.1);transform:translateY(-1px);}
.inp-btn:disabled{opacity:.35;cursor:not-allowed;transform:none;filter:none;}

/* ===== LOADING OVERLAY ===== */
.loading{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(10,13,19,0.96);backdrop-filter:blur(6px);display:none;}
.loading.show{display:flex;}
.ld-ring{width:64px;height:64px;position:relative;margin-bottom:28px;}
.ld-ring-bg{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(80,140,220,0.12);}
.ld-ring-fg{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;border-top-color:var(--ac);animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.ld-title{font-size:20px;font-weight:600;margin-bottom:8px;}
.ld-sub{font-size:13px;color:var(--tx3);margin-bottom:28px;}
.ld-bar{width:240px;height:2px;background:rgba(80,140,220,0.1);border-radius:1px;overflow:hidden;margin-bottom:28px;}
.ld-bar-fill{height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:1px;transition:width .5s ease;width:0%;}
.ld-steps{display:flex;flex-direction:column;gap:10px;}
.ld-step{display:flex;align-items:center;gap:8px;font-size:13px;font-family:var(--mono);opacity:.25;transition:.3s;}
.ld-step.done{opacity:1;}
.ld-step-dot{width:7px;height:7px;border-radius:50%;background:var(--tx3);transition:.3s;}
.ld-step.done .ld-step-dot{background:var(--gn);}
.ld-step.active .ld-step-dot{background:var(--ac);}
.ld-step.active{opacity:1;}

/* ===== RESULT PAGE ===== */
.res-wrap{max-width:1100px;margin:0 auto;padding:32px 24px 80px;}
.res-back{display:inline-flex;align-items:center;gap:4px;padding:6px 0;margin-bottom:24px;
  background:none;border:none;color:var(--tx2);font-size:13px;cursor:pointer;font-family:var(--sans);}
.res-back:hover{color:var(--ac);}

/* Eval card */
.eval{background:var(--s1);border:1px solid var(--bd);border-radius:var(--rad);padding:24px;margin-bottom:24px;}
.eval-tag{font-family:var(--mono);font-size:10px;color:var(--tx3);letter-spacing:1.5px;margin-bottom:18px;}
.eval-badges{display:grid;grid-template-columns:1fr 1fr;gap:12px 36px;margin-bottom:20px;}
.eval-badge-group label{font-size:11px;color:var(--tx3);display:block;margin-bottom:4px;}
.eval-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 14px;border-radius:6px;font-size:12px;font-weight:500;}
.eval-badge.blue{background:rgba(80,140,220,0.08);color:var(--ac);border:1px solid rgba(80,140,220,0.25);}
.eval-badge.green{background:rgba(76,217,123,0.06);color:var(--gn);border:1px solid rgba(76,217,123,0.25);}
.eval-badge.orange{background:rgba(237,161,69,0.06);color:var(--og);border:1px solid rgba(237,161,69,0.25);}
.eval-badge.red{background:rgba(232,93,117,0.06);color:var(--rd);border:1px solid rgba(232,93,117,0.25);}
.eval-reason{padding:16px;border-left:3px solid var(--ac);background:rgba(80,140,220,0.03);
  border-radius:0 8px 8px 0;font-size:13px;line-height:1.7;color:var(--tx2);margin-bottom:18px;}
.eval-stats{display:flex;gap:36px;}
.eval-stat-v{font-size:26px;font-weight:700;font-family:var(--mono);}
.eval-stat-l{font-size:10px;color:var(--tx3);margin-top:2px;}

/* Table */
.tbl-card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--rad);overflow:hidden;margin-bottom:24px;}
.tbl-hdr{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--bd);}
.tbl-title{font-size:14px;font-weight:600;}
.tbl-legend{display:flex;gap:14px;font-size:10px;color:var(--tx3);}
.tbl-legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle;}
.tbl-legend .c-bar{background:var(--ac);}
.tbl-legend .r-bar{background:var(--og);}
.tbl-color-strip{display:flex;height:3px;}
.tbl-color-strip .c-seg{flex:1;background:linear-gradient(90deg,var(--ac),#6e8edc);}
.tbl-color-strip .r-seg{flex:1;background:linear-gradient(90deg,var(--og),#e8a060);}
.tbl-scroll{overflow-x:auto;}
table.dt{width:100%;border-collapse:collapse;font-size:12px;font-family:var(--mono);}
table.dt th,table.dt td{padding:9px 12px;text-align:center;border-bottom:1px solid rgba(80,140,220,0.04);}
table.dt thead tr:first-child th{font-size:11px;font-weight:600;padding-bottom:2px;}
table.dt thead tr:first-child th.ch{color:var(--ac);}
table.dt thead tr:first-child th.rh{color:var(--og);}
table.dt thead tr:nth-child(2) th{font-size:9px;color:var(--tx3);font-weight:400;padding:3px 8px;border-bottom:1px solid var(--bd);}
table.dt .rn{color:var(--tx3);font-size:10px;width:36px;}
table.dt tbody tr:hover td{background:rgba(80,140,220,0.04);}

/* Cell tags */
.tag{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:4px;font-size:11px;white-space:nowrap;}
.tag.btwn{background:rgba(80,140,220,0.08);color:var(--ac);}
.tag.eq{background:rgba(76,217,123,0.07);color:var(--gn);}
.tag.neq{background:rgba(232,93,117,0.07);color:var(--rd);}
.tag.cmp{background:rgba(110,94,224,0.08);color:#a78bfa;}
.tag.inv{background:rgba(237,161,69,0.08);color:var(--og);}
.tag.bt{background:rgba(76,217,123,0.07);color:var(--gn);}
.tag.bf{background:rgba(232,93,117,0.06);color:var(--rd);}
.tag.any{background:rgba(85,96,112,0.1);color:var(--tx3);}
.tag.nul{background:rgba(85,96,112,0.12);color:var(--tx3);font-style:italic;}
.tag.rv{background:rgba(237,161,69,0.08);color:var(--og);font-weight:500;}
.tag b{font-weight:600;}

/* Validate */
.val-card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--rad);padding:20px;}
.val-pass{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;border-radius:6px;font-size:13px;font-weight:600;}
.val-pass.ok{background:rgba(76,217,123,0.08);color:var(--gn);border:1px solid rgba(76,217,123,0.25);}
.val-pass.ng{background:rgba(232,93,117,0.08);color:var(--rd);border:1px solid rgba(232,93,117,0.25);}
.err-list{list-style:none;margin-top:10px;}
.err-item{display:flex;gap:8px;padding:7px 10px;margin-bottom:4px;border-radius:5px;font-size:11px;
  background:rgba(232,93,117,0.04);border:1px solid rgba(232,93,117,0.12);}
.err-code{font-family:var(--mono);color:var(--rd);font-weight:600;min-width:155px;white-space:nowrap;}
.err-msg{color:var(--tx2);}

.tbl-footer{display:flex;justify-content:space-between;padding:10px 20px;font-size:10px;color:var(--tx3);
  font-family:var(--mono);border-top:1px solid var(--bd);}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-logo">
    <div class="hdr-icon">R</div>
    <div class="hdr-title">Rules <em>MCP Server</em></div>
  </div>
  <div style="display:flex;align-items:center;gap:14px;">
    <span style="font-size:11px;color:var(--tx3);"><span class="hdr-dot" id="dot"></span><span id="srv"></span></span>
    <div class="hdr-tag">PHASE 1 DEMO</div>
  </div>
</div>

<!-- LOADING OVERLAY -->
<div class="loading" id="loading">
  <div class="ld-ring"><div class="ld-ring-bg"></div><div class="ld-ring-fg"></div></div>
  <div class="ld-title">正在分析規則結構...</div>
  <div class="ld-sub" id="ldName"></div>
  <div class="ld-bar"><div class="ld-bar-fill" id="ldBar"></div></div>
  <div class="ld-steps" id="ldSteps"></div>
</div>

<!-- PAGE: INPUT -->
<div class="page active" id="pageInput">
<div class="inp-wrap">
  <div class="inp-hero">
    <div class="inp-sub">規則生成與建議服務</div>
    <h1 class="inp-h1">生成你的<br><em>標準化決策表</em></h1>
    <p class="inp-desc">輸入業務規則的 JSON 描述，系統將自動分析規則結構、驗證完整性，並生成標準化的 RuleEnvelope。</p>
  </div>
  <div class="inp-card">
    <div class="inp-presets">
      <div class="inp-pre" onclick="lp(0)">壽險核保 · 6 條 FIRST</div>
      <div class="inp-pre" onclick="lp(1)">健康獎勵 · MULTI</div>
      <div class="inp-pre" onclick="lp(2)">地區費率 · ENUM</div>
      <div class="inp-pre" onclick="lp(3)">衝突偵測 · INCONSISTENT</div>
      <div class="inp-pre" onclick="lp(4)">ENUM 錯誤</div>
    </div>
    <div class="inp-group">
      <label class="inp-label">規則名稱</label>
      <input class="inp-field" id="iName" placeholder="例如：個人壽險核保評估規則">
    </div>
    <div class="inp-group">
      <label class="inp-label">規則描述（RuleEnvelope JSON 或自然語言）</label>
      <textarea class="inp-field" id="iDesc" placeholder="貼入結構化 JSON 或自然語言描述..."></textarea>
    </div>
    <button class="inp-btn" id="btnGo" onclick="go()">⚙ 生成決策表</button>
  </div>
</div>
</div>

<!-- PAGE: RESULT -->
<div class="page" id="pageResult">
<div class="res-wrap">
  <button class="res-back" onclick="back()">← 返回首頁</button>

  <!-- Eval card -->
  <div class="eval">
    <div class="eval-tag">// 評估結果 / EVALUATION OUTPUT</div>
    <div class="eval-badges" id="evalBadges"></div>
    <div class="eval-reason" id="evalReason"></div>
    <div class="eval-stats" id="evalStats"></div>
  </div>

  <!-- Decision Table -->
  <div class="tbl-card" id="tblCard">
    <div class="tbl-hdr">
      <div class="tbl-title" id="tblTitle">決策表</div>
      <div class="tbl-legend">
        <span><i class="c-bar"></i>條件 Condition</span>
        <span><i class="r-bar"></i>結果 Result</span>
      </div>
    </div>
    <div class="tbl-color-strip" id="tblStrip"></div>
    <div class="tbl-scroll" id="tblBody"></div>
    <div class="tbl-footer">
      <span id="tblCount"></span>
      <span id="tblMeta"></span>
    </div>
  </div>

  <!-- Validate -->
  <div class="val-card" id="valCard">
    <div class="eval-tag" style="margin-bottom:12px;">// 驗證結果 / VALIDATION</div>
    <div id="valBadge"></div>
    <ul class="err-list" id="valErrors"></ul>
  </div>
</div>
</div>

<script>
const API='http://localhost:8080';
const STEPS=['解析業務規則語義','識別條件維度與資料型態','推薦決策表規則類型','窮舉場景並生成決策矩陣','驗證規則完整性與一致性'];

const PRESETS=[
  {n:'個人壽險核保評估規則',d:`{"ruleType":"DecisionTable","reason":"條件為並列比對，無先後依賴，適用決策表 FIRST 策略","rule":{"hitPolicy":"FIRST","inputs":[{"name":"age","typeRef":"INTEGER"},{"name":"hypertension","typeRef":"BOOLEAN"}],"outputs":[{"name":"decision","typeRef":"ENUM","allowedValues":["承保","人工評估","拒保"]},{"name":"premium_rate","typeRef":"DECIMAL"},{"name":"remark","typeRef":"STRING"}],"rules":[{"ruleId":"R01","priority":1,"conditions":[{"field":"age","operator":"between","value":[18,35]},{"field":"hypertension","operator":"equals","value":false}],"results":[{"field":"decision","value":"承保"},{"field":"premium_rate","value":1.0},{"field":"remark","value":"標準核保，全額承保"}]},{"ruleId":"R02","priority":2,"conditions":[{"field":"age","operator":"between","value":[18,35]},{"field":"hypertension","operator":"equals","value":true}],"results":[{"field":"decision","value":"人工評估"},{"field":"premium_rate","value":1.3},{"field":"remark","value":"高血壓加費，需提供紀錄"}]},{"ruleId":"R03","priority":3,"conditions":[{"field":"age","operator":"between","value":[36,50]},{"field":"hypertension","operator":"equals","value":false}],"results":[{"field":"decision","value":"承保"},{"field":"premium_rate","value":1.1},{"field":"remark","value":"中年標準核保"}]},{"ruleId":"R04","priority":4,"conditions":[{"field":"age","operator":"between","value":[36,50]},{"field":"hypertension","operator":"equals","value":true}],"results":[{"field":"decision","value":"人工評估"},{"field":"premium_rate","value":1.5},{"field":"remark","value":"中年高血壓，需三個月紀錄"}]},{"ruleId":"R05","priority":5,"conditions":[{"field":"age","operator":"between","value":[51,65]},{"field":"hypertension","operator":"anything"}],"results":[{"field":"decision","value":"人工評估"},{"field":"premium_rate","value":1.8},{"field":"remark","value":"高齡需健康評估"}]},{"ruleId":"R06","priority":6,"conditions":[{"field":"age","operator":"greaterThan","value":65},{"field":"hypertension","operator":"anything"}],"results":[{"field":"decision","value":"拒保"},{"field":"premium_rate","value":0},{"field":"remark","value":"超齡，不受理"}]}]}}`},
  {n:'健康獎勵折扣規則',d:`{"ruleType":"DecisionTable","reason":"三項條件獨立判斷可累加，使用 MULTI 策略","rule":{"hitPolicy":"MULTI","inputs":[{"name":"exercise_met","typeRef":"BOOLEAN"},{"name":"sleep_met","typeRef":"BOOLEAN"},{"name":"bmi_normal","typeRef":"BOOLEAN"}],"outputs":[{"name":"discount","typeRef":"DECIMAL"},{"name":"remark","typeRef":"STRING"}],"rules":[{"ruleId":"R01","priority":1,"conditions":[{"field":"exercise_met","operator":"equals","value":true},{"field":"sleep_met","operator":"anything"},{"field":"bmi_normal","operator":"anything"}],"results":[{"field":"discount","value":0.01},{"field":"remark","value":"運動達標折減"}]},{"ruleId":"R02","priority":2,"conditions":[{"field":"exercise_met","operator":"anything"},{"field":"sleep_met","operator":"equals","value":true},{"field":"bmi_normal","operator":"anything"}],"results":[{"field":"discount","value":0.005},{"field":"remark","value":"睡眠充足折減"}]},{"ruleId":"R03","priority":3,"conditions":[{"field":"exercise_met","operator":"anything"},{"field":"sleep_met","operator":"anything"},{"field":"bmi_normal","operator":"equals","value":true}],"results":[{"field":"discount","value":0.003},{"field":"remark","value":"BMI 正常折減"}]}]}}`},
  {n:'海外旅遊險費率表',d:`{"ruleType":"DecisionTable","reason":"依地區 ENUM 對應費率","rule":{"hitPolicy":"FIRST","inputs":[{"name":"region","typeRef":"ENUM","allowedValues":["Asia","Europe","Americas"]}],"outputs":[{"name":"rate","typeRef":"DECIMAL"},{"name":"remark","typeRef":"STRING"}],"rules":[{"ruleId":"R01","priority":1,"conditions":[{"field":"region","operator":"equals","value":"Asia"}],"results":[{"field":"rate","value":1.0},{"field":"remark","value":"亞洲標準費率"}]},{"ruleId":"R02","priority":2,"conditions":[{"field":"region","operator":"equals","value":"Europe"}],"results":[{"field":"rate","value":1.3},{"field":"remark","value":"歐洲加費 30%"}]},{"ruleId":"R03","priority":3,"conditions":[{"field":"region","operator":"equals","value":"Americas"}],"results":[{"field":"rate","value":1.5},{"field":"remark","value":"美洲加費 50%"}]}]}}`},
  {n:'衝突偵測測試',d:`{"ruleType":"DecisionTable","reason":"故意製造 R01/R02 條件重疊","rule":{"hitPolicy":"FIRST","inputs":[{"name":"age","typeRef":"INTEGER"},{"name":"vip","typeRef":"BOOLEAN"}],"outputs":[{"name":"result","typeRef":"STRING"}],"rules":[{"ruleId":"R01","priority":1,"conditions":[{"field":"age","operator":"between","value":[18,35]},{"field":"vip","operator":"equals","value":true}],"results":[{"field":"result","value":"Plan A"}]},{"ruleId":"R02","priority":2,"conditions":[{"field":"age","operator":"between","value":[20,30]},{"field":"vip","operator":"equals","value":true}],"results":[{"field":"result","value":"Plan B"}]}]}}`},
  {n:'ENUM 值錯誤測試',d:`{"ruleType":"DecisionTable","reason":"INVALID_ENUM_VALUE 測試","rule":{"hitPolicy":"FIRST","inputs":[{"name":"age","typeRef":"INTEGER"}],"outputs":[{"name":"status","typeRef":"ENUM","allowedValues":["APPROVED","REJECTED"]}],"rules":[{"ruleId":"R01","priority":1,"conditions":[{"field":"age","operator":"between","value":[18,65]}],"results":[{"field":"status","value":"UNKNOWN"}]}]}}`}
];

function lp(i){document.getElementById('iName').value=PRESETS[i].n;document.getElementById('iDesc').value=PRESETS[i].d;}

async function post(ep,body){const r=await fetch(API+ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return r.json();}

// ===== MAIN FLOW =====
async function go(){
  const name=document.getElementById('iName').value.trim()||'規則';
  const desc=document.getElementById('iDesc').value.trim();
  if(!desc) return;

  // Show loading
  const ld=document.getElementById('loading');
  document.getElementById('ldName').textContent='"'+name+'"';
  document.getElementById('ldSteps').innerHTML=STEPS.map(s=>`<div class="ld-step"><div class="ld-step-dot"></div><span>${s}</span></div>`).join('');
  ld.classList.add('show');

  // Animate steps
  let step=0;
  const stepEls=document.querySelectorAll('.ld-step');
  const bar=document.getElementById('ldBar');
  const timer=setInterval(()=>{
    if(step<STEPS.length){
      stepEls.forEach((el,i)=>{el.className=i<step?'ld-step done':i===step?'ld-step active':'ld-step';});
      bar.style.width=((step+1)/STEPS.length*100)+'%';
      step++;
    }
  },600);

  try{
    // 1. Recommend
    const rec=await post('/tools/recommend',{description:desc});

    // 2. Generate
    const gen=await post('/tools/generate',{description:desc,ruleType:'DecisionTable'});

    // 3. Validate
    const val=await post('/tools/validate',{ruleJson:gen,ruleType:gen.ruleType||'DecisionTable'});

    // Finish loading
    clearInterval(timer);
    stepEls.forEach(el=>el.className='ld-step done');
    bar.style.width='100%';
    await new Promise(r=>setTimeout(r,500));
    ld.classList.remove('show');

    // Render result
    renderResult(name,gen,val,rec);
    document.getElementById('pageInput').classList.remove('active');
    document.getElementById('pageResult').classList.add('active');
  }catch(e){
    clearInterval(timer);
    ld.classList.remove('show');
    alert('錯誤：'+e.message);
  }
}

function back(){
  document.getElementById('pageResult').classList.remove('active');
  document.getElementById('pageInput').classList.add('active');
}

// ===== RENDER RESULT =====
function renderResult(name,gen,val,rec){
  const ev=gen.evaluation||{};
  const rule=gen.rule||{};
  const inputs=rule.inputs||[];
  const outputs=rule.outputs||[];
  const rows=rule.rules||[];

  // Eval badges
  document.getElementById('evalBadges').innerHTML=`
    <div class="eval-badge-group"><label>推薦規則類型</label><span class="eval-badge blue">+ ${gen.ruleType||'DecisionTable'}</span></div>
    <div class="eval-badge-group"><label>規則完整性</label><span class="eval-badge ${ev.completeness==='COMPLETE'?'green':'orange'}">✓ ${ev.completeness||'—'}</span></div>
    <div class="eval-badge-group"><label>規則衝突檢測</label><span class="eval-badge ${ev.conflictDetection==='NO_CONFLICT'?'green':'red'}">${ev.conflictDetection==='NO_CONFLICT'?'✓':'✕'} ${ev.conflictDetection||'—'}</span></div>
    <div class="eval-badge-group"><label>建議執行策略</label><span class="eval-badge orange">${ev.recommendedStrategy||rule.hitPolicy||'—'}</span></div>`;

  // Reason
  document.getElementById('evalReason').innerHTML=gen.reason||rec.reason||'';

  // Stats
  document.getElementById('evalStats').innerHTML=`
    <div><div class="eval-stat-v" style="color:var(--ac)">${inputs.length}</div><div class="eval-stat-l">條件欄位</div></div>
    <div><div class="eval-stat-v" style="color:var(--ac2)">${outputs.length}</div><div class="eval-stat-l">結果欄位</div></div>
    <div><div class="eval-stat-v" style="color:var(--og)">${rows.length}</div><div class="eval-stat-l">決策場景</div></div>
    <div><div class="eval-stat-v" style="color:var(--gn)">${((ev.coverageRate||0)*100).toFixed(0)}%</div><div class="eval-stat-l">覆蓋率</div></div>`;

  // Table title
  document.getElementById('tblTitle').textContent='決策表 · '+name;

  // Color strip
  const stripHtml=`${'<div class="c-seg"></div>'.repeat(inputs.length)}${'<div class="r-seg"></div>'.repeat(outputs.length)}`;
  document.getElementById('tblStrip').innerHTML='<div style="width:36px;flex-shrink:0;"></div>'+stripHtml;

  // Table
  let h='<table class="dt"><thead><tr><th class="rn">#</th>';
  inputs.forEach(f=>{h+=`<th class="ch">${f.name}</th>`;});
  outputs.forEach(f=>{h+=`<th class="rh">${f.name}</th>`;});
  h+='</tr><tr><th></th>';
  inputs.forEach(f=>{h+=`<th>${f.typeRef}${f.allowedValues?' ['+f.allowedValues.join(',')+']':''}</th>`;});
  outputs.forEach(f=>{h+=`<th>${f.typeRef}${f.allowedValues?' ['+f.allowedValues.join(',')+']':''}</th>`;});
  h+='</tr></thead><tbody>';

  rows.forEach(r=>{
    h+=`<tr><td class="rn">${r.ruleId||''}</td>`;
    const cm={};(r.conditions||[]).forEach(c=>cm[c.field]=c);
    inputs.forEach(f=>{const c=cm[f.name];h+=`<td>${c?fmtC(c):'<span class="tag any">Any</span>'}</td>`;});
    const rm={};(r.results||[]).forEach(v=>rm[v.field]=v);
    outputs.forEach(f=>{const v=rm[f.name];h+=`<td>${v?fmtR(v):'—'}</td>`;});
    h+='</tr>';
  });
  h+='</tbody></table>';
  document.getElementById('tblBody').innerHTML=h;

  // Footer
  document.getElementById('tblCount').textContent=`共 ${rows.length} 筆規則`;
  document.getElementById('tblMeta').textContent=`schemaVersion ${gen.schemaVersion||'1.0.0'} · ${rule.hitPolicy||'FIRST'} HIT POLICY`;

  // Validate
  if(val.valid){
    document.getElementById('valBadge').innerHTML='<div class="val-pass ok">✓ VALID — 所有 11 項檢查通過</div>';
    document.getElementById('valErrors').innerHTML='';
  }else{
    document.getElementById('valBadge').innerHTML=`<div class="val-pass ng">✕ INVALID — 發現 ${(val.errors||[]).length} 個問題</div>`;
    document.getElementById('valErrors').innerHTML=(val.errors||[]).map(e=>`<li class="err-item"><span class="err-code">${e.code}</span><span class="err-msg">${e.message||''}</span></li>`).join('');
  }
}

function fmtC(c){
  const o=c.operator,v=c.value;
  if(o==='anything') return '<span class="tag any">Any</span>';
  if(o==='isNull') return '<span class="tag nul">Is null</span>';
  if(o==='isNotNull') return '<span class="tag nul">Is not null</span>';
  if(o==='between'&&Array.isArray(v)) return `<span class="tag btwn"><b>${v[0]}</b> — <b>${v[1]}</b></span>`;
  if(o==='equals'){
    if(typeof v==='boolean') return v?'<span class="tag bt">● true</span>':'<span class="tag bf">○ false</span>';
    return `<span class="tag eq">= <b>${v}</b></span>`;
  }
  if(o==='notEquals') return `<span class="tag neq">≠ <b>${v}</b></span>`;
  if(o==='greaterThan') return `<span class="tag cmp">> <b>${v}</b></span>`;
  if(o==='greaterThanOrEqual') return `<span class="tag cmp">≥ <b>${v}</b></span>`;
  if(o==='lessThan') return `<span class="tag cmp">< <b>${v}</b></span>`;
  if(o==='lessThanOrEqual') return `<span class="tag cmp">≤ <b>${v}</b></span>`;
  if(o==='in'&&Array.isArray(v)) return `<span class="tag inv">∈ [${v.join(', ')}]</span>`;
  if(o==='notIn'&&Array.isArray(v)) return `<span class="tag inv">∉ [${v.join(', ')}]</span>`;
  return `<span class="tag">${o} ${JSON.stringify(v)}</span>`;
}

function fmtR(rv){
  const v=rv.value;
  if(typeof v==='boolean') return v?'<span class="tag bt">true</span>':'<span class="tag bf">false</span>';
  if(typeof v==='number') return `<span class="tag rv">×${v}</span>`;
  return `<span class="tag rv">${v}</span>`;
}
