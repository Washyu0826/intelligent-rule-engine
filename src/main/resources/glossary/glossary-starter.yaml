# Rules MCP Server — 保險業中文字彙表 Starter (v3.14 Phase A)
#
# 此為 starter v0.1 — 25 條台灣壽險業最高頻名詞。完整版 ~110 條（agent M 研究結果）
# 後續由 BU 端校對並擴充。設計依據：docs/v3.14-schema-evolution.md §4。
#
# Schema：
#   id              — 唯一鍵 (kebab-case)
#   zh_TW           — 中文（繁）
#   zh_CN           — 中文（簡，可選）
#   en              — 英文
#   synonyms[]      — 同義詞 / 別名
#   definition      — 一句話業務定義
#   examples[]      — 1-2 個情境句（可選）
#   source          — 法源 / 公會 / 公司內規出處
#   category        — 核保 / 商品 / 理賠 / 通路 / 繳費 / 合規 / 精算
#   regulatoryLayer — law / guild / fsc / company
#   fieldCode       — 對接核心系統的欄位代碼（可選）
#   dataType        — Money / Enum / Date / Boolean / String / Integer / Decimal
#   unit            — TWD / 年 / % 等（可選）
#   valueRange      — "[min, max]" 字串（可選）
#   status          — active / deprecated / proposed
#   effectiveFrom   — 生效起日 (yyyy-MM-dd)
#   deprecatedAt    — 棄用日 (可選)
#   successor       — 後繼名詞 id（deprecated 時必填）
#   relatedTerms[]  — 關聯名詞 id
#   businessOwner   — 業務負責人 email
#   techOwner       — 技術負責人 email
#   version         — 此 entry 版本

entries:
  # ─── 核保 ───
  - id: insured
    zh_TW: 被保險人
    en: Insured
    synonyms: [被保人]
    definition: 保險事故發生時遭受損害、享賠償請求權之人
    source: 保險法 §4
    category: 核保
    regulatoryLayer: law
    fieldCode: INSURED
    dataType: String
    status: active
    effectiveFrom: '2026-05-13'
    relatedTerms: [proposer, beneficiary]
    businessOwner: underwriting@grouplife
    techOwner: platform-team@grouplife
    version: '1.0'

  - id: proposer
    zh_TW: 要保人
    en: Proposer
    synonyms: [投保人]
    definition: 與保險人訂約並負繳費義務之人
    source: 保險法 §3
    category: 核保
    regulatoryLayer: law
    fieldCode: POLICYHOLDER
    dataType: String
    status: active
    effectiveFrom: '2026-05-13'
    relatedTerms: [insured, beneficiary]
    businessOwner: underwriting@grouplife
    techOwner: platform-team@grouplife
    version: '1.0'

  - id: beneficiary
    zh_TW: 受益人
    en: Beneficiary
    definition: 經約定享有保險金請求權之人
    source: 保險法 §5
    category: 核保
    regulatoryLayer: law
    dataType: String
    status: active
    effectiveFrom: '2026-05-13'
    relatedTerms: [insured, proposer]
    businessOwner: underwriting@grouplife
    techOwner: platform-team@grouplife
    version: '1.0'

  - id: insurance-age
    zh_TW: 保險年齡
    en: Insurance Age
    synonyms: [投保年齡]
    definition: 計算費率用之年齡，採足歲加未滿一年逾六個月進位
    source: 人壽保險單示範條款
    category: 精算
    regulatoryLayer: guild
    fieldCode: INSURANCE_AGE
    dataType: Integer
    unit: 年
    valueRange: '[0, 100]'
    status: active
    effectiveFrom: '2026-05-13'
    businessOwner: actuarial@grouplife
    techOwner: platform-team@grouplife
    version: '1.0'

  - id: waiting-period
    zh_TW: 等待期
    en: Waiting Period
    definition: 契約生效後一定期間內事故不予給付（常見癌症 90 日）
    source: 人壽保險單示範條款
    category: 核保
    regulatoryLayer: guild
    dataType: Integer
    unit: 日
    status: active
    effectiveFrom: '2026-05-13'
    businessOwner: underwriting@grouplife
    techOwner: platform-team@grouplife
    version: '1.0'

  # ─── 合規 ───
  - id: roc-id
    zh_TW: 中華民國身分證字號
    en: ROC National ID
    synonyms: [身分證號, 國民身分證統一編號]
    definition: 中華民國國民身分證統一編號（10 碼：1 字母 + 9 數字 + 校驗碼）
    examples:
      - 'A123456789'
    source: 戶籍法
    category: 合規
    regulatoryLayer: law
    fieldCode: NATIONAL_ID
    dataType: String
    status: active
    effectiveFrom: '2026-05-13'
    relatedTerms: [nationality, fatca, kyc]
    businessOwner: compliance@grouplife
    techOwner: platform-team@grouplife
    version: '1.0'

  - id: nationality
    zh_TW: 國籍別
    en: Nationality
    definition: 客戶法律上的國籍歸屬，AML/FATCA/CRS 申報依據
    source: 金融機構防制洗錢辦法 §3
    category: 合規
    regulatoryLayer: fsc
    fieldCode: NATIONALITY_CODE
    dataType: Enum
    status: active
    effectiveFrom: '2026-05-13'
    relatedTerms: [fatca, crs, kyc, roc-id]
    businessOwner: compliance@grouplife
    techOwner: platform-team@grouplife
    version: '1.0'

  - id: fatca
    zh_TW: FATCA
    en: Foreign Account Tax Compliance Act
    synonyms: [肥咖條款]
    definition: 美國海外帳戶稅收遵循法，識別美籍客戶
    source: 金融機構執行 FATCA 作業辦法
    category: 合規
    regulatoryLayer: fsc
    status: active
    effectiveFrom: '2026-05-13'
    relatedTerms: [crs, kyc, nationality]
    businessOwner: compliance@grouplife
    techOwner: platform-team@grouplife
    version: '1.0'

  - id: aml
    zh_TW: 防制洗錢
    en: AML
    synonyms: [Anti-Money Laundering]
    definition: 防止洗錢之機制
    source: 洗錢防制法
    category: 合規
    regulatoryLayer: law
    status: active
    effectiveFrom: '2026-05-13'
    relatedTerms: [kyc, fatca, crs]
    businessOwner: compliance@grouplife
    techOwner: platform-team@grouplife
    version: '1.0'

  - id: kyc
    zh_TW: 客戶身分確認
    en: KYC
    synonyms: [Know Your Customer]
    definition: 客戶身分確認程序
    source: 金融機構防制洗錢辦法 §3
    category: 合規
    regulatoryLayer: fsc
    status: active
    effectiveFrom: '2026-05-13'
    relatedTerms: [aml, fatca, nationality]
    businessOwner: compliance@grouplife
    techOwner: platform-team@grouplife
    version: '1.0'

  # ─── 商品 / 保單 ───
  - id: sum-insured
    zh_TW: 保額
    en: Sum Insured
    synonyms: [保險金額]
    definition: 保險人最高給付額度
    source: 保險法 §72
    category: 商品
    regulatoryLayer: law
    fieldCode: SUM_INSURED
    dataType: Money
    unit: TWD
    valueRange: '[1, 100000000]'
    status: active
    effectiveFrom: '2026-05-13'
    relatedTerms: [premium, surrender-value]
    businessOwner: product@grouplife
    techOwner: platform-team@grouplife
    version: '1.0'

  - id: premium
    zh_TW: 保費
    en: Premium
    synonyms: [保險費]
    definition: 要保人應繳之對價
    source: 保險法 §21
    category: 商品
    regulatoryLayer: law
    fieldCode: PREMIUM
    dataType: Money
    unit: TWD
    status: active
    effectiveFrom: '2026-05-13'
    relatedTerms: [sum-insured, grace-period]
    businessOwner: product@grouplife
    techOwner: platform-team@grouplife
    version: '1.0'

  - id: reserve
    zh_TW: 責任準備金
    en: Policy Reserve
    definition: 保險公司為未來給付義務提存之準備（公司側）
    source: 保險法 §145
    category: 商品
    regulatoryLayer: law
    dataType: Money
    unit: TWD
    status: active
    effectiveFrom: '2026-05-13'
    businessOwner: actuarial@grouplife
    techOwner: platform-team@grouplife
    version: '1.0'

  - id: policy-value
    zh_TW: 保價金
    en: Policy Value Reserve
    synonyms: [保單價值準備金]
    definition: 已繳保費扣除成本後依約定利率累積之帳戶價值
    source: 保險業會計處理準則
    category: 商品
    regulatoryLayer: fsc
    dataType: Money
    unit: TWD
    status: active
    effectiveFrom: '2026-05-13'
    relatedTerms: [surrender-value, premium]
    businessOwner: actuarial@grouplife
    techOwner: platform-team@grouplife
    version: '1.0'

  - id: surrender-value
    zh_TW: 解約金
    en: Surrender Value
    synonyms: [保單現金價值]
    definition: 解約退還金額，繳費滿一年不得低於保價金 3/4
    source: 保險法 §119
    category: 商品
    regulatoryLayer: law
    dataType: Money
    unit: TWD
    status: active
    effectiveFrom: '2026-05-13'
    relatedTerms: [policy-value, maturity-benefit]
    businessOwner: actuarial@grouplife
    techOwner: platform-team@grouplife
    version: '1.0'

  - id: maturity-benefit
    zh_TW: 滿期金
    en: Maturity Benefit
    definition: 契約屆滿仍生存之給付
    source: 人壽保險單示範條款
    category: 商品
    regulatoryLayer: guild
    dataType: Money
    unit: TWD
    status: active
    effectiveFrom: '2026-05-13'
    relatedTerms: [surrender-value]
    businessOwner: product@grouplife
    techOwner: platform-team@grouplife
    version: '1.0'

  # ─── 理賠 ───
  - id: disability
    zh_TW: 失能
    en: Disability
    synonyms: [殘廢]
    definition: 喪失身體 / 精神機能至條款表定等級
    source: 失能程度與保險金給付表（107 年修訂）
    category: 理賠
    regulatoryLayer: guild
    status: active
    effectiveFrom: '2018-06-15'
    relatedTerms: [disability-old]
    businessOwner: claims@grouplife
    techOwner: platform-team@grouplife
    version: '1.0'

  - id: disability-old
    zh_TW: 殘廢
    en: Disability (legacy)
    definition: 2018-06-15 公會示範條款修訂後改稱「失能」
    source: 人壽公會 107 年示範條款修訂
    category: 理賠
    regulatoryLayer: guild
    status: deprecated
    effectiveFrom: '2010-01-01'
    deprecatedAt: '2018-06-15'
    successor: disability
    businessOwner: claims@grouplife
    techOwner: platform-team@grouplife
    version: '1.0'

  - id: critical-illness
    zh_TW: 重大疾病
    en: Critical Illness
    synonyms: [重疾]
    definition: 條款列舉七項（心肌梗塞、癌症等）
    source: 重大疾病險示範條款
    category: 理賠
    regulatoryLayer: guild
    status: active
    effectiveFrom: '2026-05-13'
    businessOwner: claims@grouplife
    techOwner: platform-team@grouplife
    version: '1.0'

  # ─── 通路 ───
  - id: channel-agent
    zh_TW: 保代
    en: Agent Company
    synonyms: [保險代理人]
    definition: 代理保險人招攬之公司
    source: 保險法 §8
    category: 通路
    regulatoryLayer: law
    status: active
    effectiveFrom: '2026-05-13'
    relatedTerms: [channel-broker]
    businessOwner: distribution@grouplife
    techOwner: platform-team@grouplife
    version: '1.0'

  - id: channel-broker
    zh_TW: 保經
    en: Broker
    synonyms: [保險經紀人]
    definition: 基於被保險人利益洽訂契約之人/公司
    source: 保險法 §9
    category: 通路
    regulatoryLayer: law
    status: active
    effectiveFrom: '2026-05-13'
    relatedTerms: [channel-agent]
    businessOwner: distribution@grouplife
    techOwner: platform-team@grouplife
    version: '1.0'

  - id: mobile-insurance
    zh_TW: 行動投保
    en: Mobile Underwriting
    definition: 業務員以行動載具（iPad）完成要保
    source: 公司實務（待確認）
    category: 通路
    regulatoryLayer: company
    status: proposed
    effectiveFrom: '2026-05-13'
    businessOwner: distribution@grouplife
    techOwner: platform-team@grouplife
    version: '1.0'

  - id: online-insurance
    zh_TW: 網路投保
    en: Online Insurance
    definition: 透過保險業網站直接投保
    source: 保險業辦理電子商務應注意事項
    category: 通路
    regulatoryLayer: fsc
    status: active
    effectiveFrom: '2026-05-13'
    businessOwner: distribution@grouplife
    techOwner: platform-team@grouplife
    version: '1.0'

  # ─── 繳費 ───
  - id: grace-period
    zh_TW: 寬限期
    en: Grace Period
    definition: 保費到期催告後 30 日內仍可繳付
    source: 保險法 §116
    category: 繳費
    regulatoryLayer: law
    dataType: Integer
    unit: 日
    status: active
    effectiveFrom: '2026-05-13'
    relatedTerms: [lapse, premium]
    businessOwner: operations@grouplife
    techOwner: platform-team@grouplife
    version: '1.0'

  - id: lapse
    zh_TW: 停效
    en: Lapse
    definition: 寬限期屆滿未繳保費，契約效力停止
    source: 保險法 §116
    category: 繳費
    regulatoryLayer: law
    status: active
    effectiveFrom: '2026-05-13'
    relatedTerms: [grace-period]
    businessOwner: operations@grouplife
    techOwner: platform-team@grouplife
    version: '1.0'
