spring:
  application:
    name: rules-mcp-server

  # ── Persistence（P1-S2）──
  datasource:
    # 本地開發預設連本機 PostgreSQL 服務（127.0.0.1:5432 的 rules 庫）；
    # 若改用 docker compose 的 postgres，URL 換成 localhost:5433（見 docker-compose.yml 註解）
    # 容器/雲上以 SPRING_DATASOURCE_* 環境變數覆蓋（12-Factor）
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rules}
    username: ${SPRING_DATASOURCE_USERNAME:rules}
    password: ${SPRING_DATASOURCE_PASSWORD:rules-local-dev}
  jpa:
    hibernate:
      # schema 的唯一真相來源是 Flyway migration —— Hibernate 只驗證 entity 與
      # 實際 schema 一致，不准它改表（ddl-auto: update 在多實例/回滾情境是災難）
      ddl-auto: validate
    open-in-view: false   # OSIV 預設開啟會讓連線佔用橫跨整個 request，明確關閉
  flyway:
    enabled: true
    locations: classpath:db/migration

  lifecycle:
    timeout-per-shutdown-phase: 30s
  web:
    resources:
      static-locations: classpath:/static/,file:./static/

  ai:
    mcp:
      server:
        name: rules-mcp-server
        version: 1.0.0
        type: SYNC
        # 這段是給 MCP client（AI）看的使用說明 —— 它決定 AI 會不會正確選用工具。
        # 內容過期等同給錯指示，改動功能範圍時務必同步（McpServerIdentityTest 釘住關鍵字）。
        instructions: >
          Rules MCP Server 把業務規格轉成 engine-neutral 的 RuleEnvelope JSON，
          並提供驗證、幾何分析（覆蓋缺口 / 規則重疊）、型態轉換與樹優化。
          正式支援的規則型態為 DecisionTable 與 DecisionTree（兩者可雙向轉換）；
          ScoreCard 目前僅為 stub，不要用於正式輸出。
          典型流程：generateRulePayload 產生規則 → validateRuleSchema 驗證 →
          analyzeRulePayload 檢查覆蓋缺口與重疊 → 有問題則修正後重跑驗證。
          規則的核准與生效不提供工具：本服務採 maker-checker 治理，
          送審之後的核准、生效、退役必須由具備 CHECKER / ADMIN 身分的人在系統中操作。
        capabilities:
          tool: true
          resource: true

# 稽核儲存層：jpa = 落 PostgreSQL（P1-S3）；in-memory = v3.12 舊行為
# （測試環境用它：src/test/resources/application-test.yml 明確覆蓋為 in-memory）
# 注意：這是頂層鍵，必須放在 spring 區塊之外 —— 曾因插在 spring 區塊中間而把
# spring.ai / spring.web / spring.lifecycle 全部吃進 audit 底下（McpServerIdentityTest 釘住）
audit:
  repository: jpa

# ==========================================
# 版本管理（計畫書要求 schemaVersion / promptVersion 可追溯）
# ==========================================
rules:
  schema-version: "1.0.0"
  prompt-version: "p3.13.0"
  # LLM 設定
  llm:
    enabled: true             # true = 由 server 端 LLM 生成；false = 由 MCP client / 外部 AI 先轉換
    provider: ollama            # gemini | ollama | claude | openai
    # 全 provider fallback model；建議用各 provider 專屬欄位（rules.llm.{claude|gemini|ollama|openai}.model）
    # 各 service 的 @Value 會走 ${rules.llm.<provider>.model:${rules.llm.model:<provider 預設>}} 鏈
    # model: "qwen2.5:7b"        # 已移除全域 model — 避免共用同名導致 Claude/Gemini 拿到 Ollama 的 model 名而打 404
    # 各 provider 的 key 走自己的命名空間（與 model 一致）。
    # 舊的全域 rules.llm.api-key 仍保留為 fallback，但 Claude 與 Gemini 共用它時
    # 兩家不可能同時設定 —— 新設定請一律用 rules.llm.<provider>.api-key。
    api-key: "${RULES_LLM_API_KEY:}"   # legacy fallback（12-Factor: 從環境變數注入）
    timeout-seconds: 180
    max-async-timeout-seconds: 1800   # 多 case 端點（/test-run）非同步逾時封頂；逾時會 cancel(true) 中止剩餘 case
    max-retry: 3              # Level A: JSON parse retry 上限
    self-repair: false        # Level B: 驗證錯誤回饋修復（true=品質優先但多花 API 額度，false=速度優先）
    claude:
      api-key: "${CLAUDE_API_KEY:}"
    gemini:
      api-key: "${GEMINI_API_KEY:}"
    ollama:
      base-url: "http://localhost:11434"
    openai:
      api-key: "${OPENAI_API_KEY:}"
      model: "gpt-4o-mini"
  # 生成前輸入偵測閘（pre-flight gate）—— 純符號、0 token
  preflight:
    enabled: true
    mode: warn              # off（停用、行為不變）| warn（附報告不阻擋）| block（有 ERROR 即短路不打 LLM）
    min-quality: 0.4        # 完整度低於此值列為 blocker
    require-outputs: true   # 無任何輸出欄位列為 blocker
    min-length: 15          # 描述短於此字數列為 blocker
  # 核保詞彙包：公開通用層（classpath）＋本地覆寫檔（公司自己的欄位代碼與值域，不進 repo）
  glossary:
    packs: glossary/underwriting-vocabulary.yaml
    override-file: "${RULES_GLOSSARY_OVERRIDE:}"
  # 精算邊界：送審時逐列檢查；正式環境以本地檔案取代示範檔
  bounds:
    enabled: true
    file: "${RULES_BOUNDS_FILE:}"
  # 驗證設定
  validation:
    max-tree-depth: 10
    max-table-rows: 200
    max-columns: 50
  # DecisionTree 設定
  tree:
    max-repair-rounds: 3
  # LLM 長工作執行緒池（AsyncExecutorConfig；core=max 固定大小 + 閒置回收 + 有界佇列滿載回 429）
  executor:
    llm:
      pool-size: 8          # /generate /test-run /explain /narrate /evaluate 共用
      queue-capacity: 32
    sse:
      pool-size: 16         # /generate/stream SSE 推送
      queue-capacity: 64
  # ── JWT 認證（P1-S4）──
  security:
    jwt:
      # permissive = /tools/** 過渡期放行（帶 token 仍解析出身分，稽核可歸因）；
      # enforce    = 無 token 一律 401。前端登入頁（P1-S5）落地後切 enforce。
      # /auth/me 不受此開關影響、永遠強制 —— enforce 行為的驗證錨點。
      mode: permissive
      # HS256 需 >= 32 bytes；dev 預設僅供本機，prod 由 RULES_JWT_SECRET 注入
      secret: "${RULES_JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef}"
      ttl-minutes: 60
    demo-users:
      enabled: true         # prod 必須關（application-prod.yml）
      password: "${RULES_DEMO_PASSWORD:demo-pass-2026}"

# ==========================================
# Observability（計畫書要求 Actuator + Micrometer）
# ==========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: rules-mcp-server

server:
  port: 8080
  shutdown: graceful   # 滾動部署時先完成在途請求（含 SSE）再關閉

logging:
  level:
    com.ruleengine.rules: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [%X{traceId}] %msg%n"
